<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Precios 💰</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <style>
    body {
      background: #f8f9fa;
    }
    .resultado {
      font-size: 1.5rem;
      font-weight: bold;
    }
    .emoji {
      font-size: 2rem;
    }
    table {
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-4 animate__animated animate__fadeInDown">Calculadora de Precios con Margen de Ganancia 💸</h1>
    <div class="card shadow p-4 animate__animated animate__fadeInUp">
      <form id="formulario">
        <div class="mb-3">
          <label for="concepto" class="form-label">Nombre del producto</label>
          <input type="text" class="form-control" id="concepto" required>
        </div>
        <div class="mb-3">
          <label for="costo" class="form-label">Costo base del producto ($)</label>
          <input type="number" class="form-control" id="costo" required min="0" step="0.01">
        </div>
        <div class="mb-3">
          <label for="ganancia" class="form-label">Porcentaje de ganancia (%)</label>
          <input type="number" class="form-control" id="ganancia" required min="0" step="0.01">
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Calcular Precio Final 🚀</button>
      </form>
      <div id="resultado" class="mt-4 text-center animate__animated" style="display: none;">
        <p class="resultado">Precio final sugerido: <span id="precioFinal"></span> 💵</p>
        <p class="resultado">Ganancia obtenida: <span id="gananciaFinal"></span> 📈</p>
      </div>
    </div>

    <div class="mt-4 text-end">
      <button class="btn btn-success me-2" onclick="exportarExcel()">Exportar a Excel 📗</button>
      <button class="btn btn-danger me-2" onclick="exportarPDF()">Exportar a PDF 📄</button>
      <button class="btn btn-secondary" onclick="limpiarTabla()">Limpiar Tabla 🧹</button>
    </div>

    <div class="table-responsive animate__animated animate__fadeInUp">
      <table class="table table-striped table-bordered mt-4" id="tablaProductos">
        <thead class="table-dark">
          <tr>
            <th>Producto 🛍️</th>
            <th>Costo ($)</th>
            <th>Ganancia (%)</th>
            <th>Precio Final ($)</th>
            <th>Ganancia ($)</th>
            <th>Acción ❌</th>
          </tr>
        </thead>
        <tbody>
          <!-- Filas dinámicas -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'productos_calculadora';

    function guardarEnLocalStorage(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function obtenerDeLocalStorage() {
      const datos = localStorage.getItem(STORAGE_KEY);
      return datos ? JSON.parse(datos) : [];
    }

    function eliminarProducto(index) {
      const productos = obtenerDeLocalStorage();
      productos.splice(index, 1);
      guardarEnLocalStorage(productos);
      renderizarTabla(productos);
    }

    function limpiarTabla() {
      if (confirm('¿Estás seguro de que deseas eliminar todos los productos?')) {
        localStorage.removeItem(STORAGE_KEY);
        renderizarTabla([]);
      }
    }

    function renderizarTabla(productos) {
      const tbody = document.querySelector('#tablaProductos tbody');
      tbody.innerHTML = '';
      productos.forEach((producto, index) => {
        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td>${producto.concepto}</td>
          <td>$${producto.costo.toFixed(2)}</td>
          <td>${producto.porcentaje.toFixed(2)}%</td>
          <td>$${producto.precioFinal.toFixed(2)}</td>
          <td>$${producto.ganancia.toFixed(2)}</td>
          <td><button class="btn btn-sm btn-outline-danger" onclick="eliminarProducto(${index})">Eliminar</button></td>
        `;
        tbody.appendChild(fila);
      });
    }

    document.getElementById('formulario').addEventListener('submit', function(e) {
      e.preventDefault();

      const concepto = document.getElementById('concepto').value.trim();
      const costo = parseFloat(document.getElementById('costo').value);
      const porcentaje = parseFloat(document.getElementById('ganancia').value);

      if (!concepto || isNaN(costo) || isNaN(porcentaje) || costo < 0 || porcentaje < 0) {
        alert('Por favor, ingrese valores válidos.');
        return;
      }

      const ganancia = costo * (porcentaje / 100);
      const precioFinal = costo + ganancia;

      document.getElementById('precioFinal').textContent = `$${precioFinal.toFixed(2)}`;
      document.getElementById('gananciaFinal').textContent = `$${ganancia.toFixed(2)}`;

      const resultadoDiv = document.getElementById('resultado');
      resultadoDiv.style.display = 'block';
      resultadoDiv.classList.remove('animate__fadeOut');
      resultadoDiv.classList.add('animate__fadeIn');

      const productos = obtenerDeLocalStorage();
      productos.push({ concepto, costo, porcentaje, precioFinal, ganancia });
      guardarEnLocalStorage(productos);
      renderizarTabla(productos);

      document.getElementById('formulario').reset();
    });

    function exportarExcel() {
      const tabla = document.getElementById('tablaProductos');
      const wb = XLSX.utils.table_to_book(tabla, { sheet: "Productos" });
      XLSX.writeFile(wb, "productos.xlsx");
    }

    function exportarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.autoTable({ html: '#tablaProductos' });
      doc.save('productos.pdf');
    }

    document.addEventListener('DOMContentLoaded', () => {
      const productos = obtenerDeLocalStorage();
      renderizarTabla(productos);
    });
  </script>
</body>
</html>
